<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="description" content="Bilim, mühendislik, ölç-say, teknoloji ve sanat: 23 seslendirmeli etkinlik.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>NOVA ECE STEAM Lab</title>

<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* iOS: iki parmakla ve çift dokunuşla yakınlaştırma kapalı */
html,body{touch-action:pan-x pan-y}
/* NOVA ECE kurumsal kimliği: Manrope + Inter, indigo / yıldız sarısı / gece mavisi, slate nötrler. Düzen: üstte gece bandı, altında konuşma şeridi, içerik kartları; etkinlikte solda sahne, sağda kontrol paneli. */
:root{
  --bg:#F8FAFC; --panel:#FFFFFF; --ink:#0F172A; --muted:#475569; --line:#E2E8F0; --soft:#F1F5F9;
  --accent:#4F46E5; --accent-ink:#FFFFFF; --accent-deep:#312E81; --star:#F59E0B; --sel:#38BDF8;
  --ok:#047857; --ok-bg:#ECFDF5; --warn:#B45309; --warn-bg:#FFFBEB; --bad:#BE123C; --bad-bg:#FFF1F2;
  --sci:#0369A1; --sci-bg:#E0F2FE; --eng:#B45309; --eng-bg:#FFFBEB; --math:#047857; --math-bg:#ECFDF5; --tech:#6D28D9; --tech-bg:#F5F3FF;
  --stage-sky:#E0F2FE; --stage-ground:#BBF7D0; --codebg:#0F172A; --codeink:#E2E8F0;
  --night:radial-gradient(120% 130% at 72% 12%,#4F46E5 0%,#312E81 52%,#0F172A 100%);
  --aurora:linear-gradient(135deg,#4338CA 0%,#6366F1 55%,#38BDF8 100%);
  --display:"Manrope","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F172A; --panel:#1E293B; --ink:#F8FAFC; --muted:#94A3B8; --line:#334155; --soft:#172033;
  --accent:#818CF8; --accent-ink:#0F172A; --accent-deep:#4338CA; --star:#FBBF24; --sel:#38BDF8;
  --ok:#34D399; --ok-bg:#0B2A22; --warn:#FBBF24; --warn-bg:#2A2110; --bad:#FB7185; --bad-bg:#2B1320;
  --sci:#38BDF8; --sci-bg:#0C2A3D; --eng:#FBBF24; --eng-bg:#2A2110; --math:#34D399; --math-bg:#0B2A22; --tech:#A78BFA; --tech-bg:#1E1B4B;
  --stage-sky:#1E3A5F; --stage-ground:#1F4D3A; --codebg:#020617; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F172A; --panel:#1E293B; --ink:#F8FAFC; --muted:#94A3B8; --line:#334155; --soft:#172033;
  --accent:#818CF8; --accent-ink:#0F172A; --accent-deep:#4338CA; --star:#FBBF24; --sel:#38BDF8;
  --ok:#34D399; --ok-bg:#0B2A22; --warn:#FBBF24; --warn-bg:#2A2110; --bad:#FB7185; --bad-bg:#2B1320;
  --sci:#38BDF8; --sci-bg:#0C2A3D; --eng:#FBBF24; --eng-bg:#2A2110; --math:#34D399; --math-bg:#0B2A22; --tech:#A78BFA; --tech-bg:#1E1B4B;
  --stage-sky:#1E3A5F; --stage-ground:#1F4D3A; --codebg:#020617; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding-inline:16px;padding-block:12px 32px;margin:0;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sel);outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.app{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:center;gap:12px;background:var(--night);border-radius:20px;padding:10px 14px;color:#F8FAFC;box-shadow:0 12px 28px rgba(15,23,42,.18)}
.brand{display:flex;flex-direction:column;gap:3px;line-height:1;min-width:0;flex:1 1 auto}
.lockup{height:18px;width:98px;align-self:flex-start;display:block;--lo:#818CF8;--ls:#FBBF24;--ln:#F8FAFC;--le:#818CF8}
.brand b{font:800 clamp(20px,5.6vw,26px)/1.05 var(--display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.back{flex:none;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font:800 20px var(--display);color:#fff}
.lang{flex:none;display:flex;border:1px solid rgba(255,255,255,.3);border-radius:12px;overflow:hidden}
.lang button{padding:5px 10px;font:700 13px var(--body);color:#E0E7FF}
.lang button[aria-pressed="true"]{background:#F8FAFC;color:#312E81}
.say{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 3px rgba(15,23,42,.07);border-radius:18px;padding:10px 12px;min-height:60px}
.say img{width:48px;height:48px;object-fit:contain;flex:none}
.say p{margin:0;font:600 17px/1.4 var(--body);text-wrap:pretty;min-width:0}
.say .rep{margin-left:auto;flex:none;width:40px;height:40px;border-radius:12px;background:var(--soft);font-size:18px}
.eyebrow{font:600 12.5px/1.4 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:4px 0 0}
.muted{color:var(--muted)}
/* ana ekran */
.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:660px){.areas{grid-template-columns:minmax(0,1fr)}}
.acard{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;align-items:center;text-align:left;border-radius:20px;padding:14px;background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 3px rgba(15,23,42,.07);position:relative;overflow:hidden}
.acard::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.acard .pic{width:92px;height:92px;border-radius:18px;display:grid;place-items:center;background:var(--cb)}
.acard .pic img{width:80px;height:80px;object-fit:contain}
.acard .letter{font:800 12px var(--body);letter-spacing:.1em;color:var(--c);text-transform:uppercase}
.acard h2{font-size:21px;line-height:1.15;margin:2px 0 4px}
.acard p{margin:0 0 6px;font-size:14px;color:var(--muted)}
.dots{display:flex;gap:4px;flex-wrap:wrap}.dots i{width:11px;height:11px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--star)}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.tools{grid-template-columns:minmax(0,1fr)}}
.tcard{display:flex;gap:12px;align-items:center;text-align:left;border-radius:16px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);min-width:0;text-decoration:none;color:inherit}
.tcard .ti{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--soft);flex:none}
.tcard .ti svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tcard b{font:800 16px/1.2 var(--display);display:block}.tcard span{font-size:13px;color:var(--muted)}
/* alan ekranı */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.xcard{display:flex;flex-direction:column;gap:6px;text-align:left;border-radius:18px;padding:14px;background:var(--panel);border:1px solid var(--line);position:relative;min-width:0}
.xcard img,.xcard svg.ico{width:64px;height:64px;object-fit:contain}
.xcard h3{font-size:18px;line-height:1.2}
.xcard p{margin:0;font-size:13.5px;color:var(--muted)}
.xcard .st{position:absolute;top:12px;right:14px;color:var(--star);font-size:15px;letter-spacing:1px}
/* etkinlik */
.act{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.act{grid-template-columns:minmax(0,1fr)}}
.stage{width:100%;aspect-ratio:5/3;max-width:100%;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--stage-sky);position:relative;touch-action:manipulation}
.stage svg{display:block;width:100%;height:100%}
.act>.stage{position:sticky;top:8px;z-index:2;box-shadow:0 4px 12px rgba(15,23,42,.07)}
.pnl{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:17px}
.card.flat{padding:0;border:0;background:none}
.q{font:700 17px/1.35 var(--display)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{border-radius:14px;padding:12px 16px;border:2px solid var(--line);background:var(--panel);font:700 16px var(--body);display:inline-flex;align-items:center;gap:8px;min-height:48px}
.opt img{height:34px;width:34px;object-fit:contain}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}.opt.badx{border-color:var(--bad);background:var(--bad-bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:12px;padding:8px 12px;border:2px solid var(--line);background:var(--panel);font:600 14.5px var(--body);display:inline-flex;align-items:center;gap:6px}
.chip small{font-weight:700;color:var(--warn)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.grp{display:flex;flex-direction:column;gap:6px}.grp>span{font:600 12.5px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border-radius:14px;padding:12px 20px;font:800 17px/1 var(--display);display:inline-flex;align-items:center;gap:8px;border:1px solid transparent}
.btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep)}
.btn.pri:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.ghost{background:var(--panel);border-color:var(--line)}
.btn.sm{padding:9px 14px;font-size:15px}
.fb{border-radius:14px;padding:10px 12px;font:600 15px/1.4 var(--body)}
.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.no{background:var(--warn-bg);color:var(--warn)}
.why{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:15px}
.why b{font-family:var(--display)}
.tray{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tray>div{background:var(--soft);border-radius:14px;padding:8px 10px;min-height:70px}
.tray b{font:700 13px var(--body);color:var(--muted);display:block;margin-bottom:4px}
.tray .it{display:inline-flex;flex-direction:column;align-items:center;margin:2px 4px;font-size:11px;position:relative}
.tray .it img{width:38px;height:38px;object-fit:contain}
.tray .it.miss::after{content:"";position:absolute;inset:-2px;border:2px dashed var(--bad);border-radius:8px}
.code{margin:0;background:var(--codebg);color:var(--codeink);border-radius:14px;padding:12px 14px;font:500 14px/1.6 var(--mono);overflow-x:auto;white-space:pre}
.code .k{color:#FBBF24}.code .c{color:#94A3B8}.code .n{color:#7DD3FC}
.num{font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:12px;padding:4px}
.stepper button{width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font:800 20px var(--display)}
.stepper b{min-width:30px;text-align:center;font:800 20px var(--display);font-variant-numeric:tabular-nums}
.numpad{display:flex;flex-wrap:wrap;gap:8px}.numpad button{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font:800 18px var(--display)}
/* ızgaralar */
.sym{display:grid;grid-template-columns:repeat(4,1fr) 18px repeat(4,1fr);gap:4px;max-width:420px;margin:0 auto}
.sym button{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:var(--panel)}
.sym .body{grid-row:span 6;background:#334155;border-radius:9px}
.sym button.lk{cursor:default}
.diary{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.diary>div{background:var(--soft);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:12px;min-width:0}
.diary select{width:100%;font:inherit;font-size:11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:2px}
.diary .mini{display:flex;gap:2px;align-items:center}.diary .mini button{width:22px;height:22px;border-radius:6px;background:var(--panel);border:1px solid var(--line);font-weight:800}
canvas.draw{width:100%;max-width:520px;aspect-ratio:1;border-radius:20px;border:1px solid var(--line);background:#fff;touch-action:none;display:block;margin:0 auto}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1.5px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
/* öğretmen */
.steam{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:620px){.steam{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sbox .L{font:800 28px/1 var(--display);color:var(--accent)}
.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--aurora)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
td .tag{display:inline-block;font:700 11px var(--body);padding:2px 6px;border-radius:6px;background:var(--soft);margin:1px}
textarea{width:100%;min-height:110px;font:500 12px/1.5 var(--mono);border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:10px}
input[type=text]{font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 12px;width:160px}
.faces{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.face{display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:18px;padding:10px 14px;border:2px solid var(--line);background:var(--panel);font:700 15px var(--body)}
.face svg{width:72px;height:72px}
.storyl{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sl{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sl .no{font:700 12px var(--body);color:var(--accent);letter-spacing:.06em}
.sl h3{font-size:16px}.sl p{margin:0;font-size:13.5px;color:var(--muted)}
.sl .to{display:flex;align-items:center;gap:8px;font:700 14px var(--body)}
.sl .to img{width:30px;height:30px;object-fit:contain}
/* tamamlama */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(4px);z-index:10;padding:16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);box-shadow:0 24px 56px rgba(15,23,42,.16);border-radius:24px;padding:22px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.modal img.h{width:110px;height:110px;object-fit:contain}
.modal h2{font-size:28px}
.stars{display:flex;gap:6px;font-size:32px;color:var(--line)}.stars .on{color:var(--star)}
.modal .why,.modal .home{text-align:left;width:100%}
.home{border:1px dashed var(--accent);border-radius:14px;padding:10px 12px;font-size:14.5px}
.home b{color:var(--accent);font-family:var(--display)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes jig{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes wob{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <button class="back" id="back" hidden aria-label="Geri">←</button>
    <div class="brand"><svg class="lockup" viewBox="0 6 456 84" role="img" aria-label="NOVA ECE"><g transform="translate(2,0)"><path d="M 49.72 22.55 A 30 30 0 1 0 73.45 46.28" fill="none" style="stroke:var(--lo)" stroke-width="10" stroke-linecap="round"/><path d="M68 14 Q70.5 25.5 82 28 Q70.5 30.5 68 42 Q65.5 30.5 54 28 Q65.5 25.5 68 14 Z" style="fill:var(--ls)"/></g><g transform="translate(108,14)" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><g style="stroke:var(--ln)"><path d="M0 52 V8 L32 52 V8"/><ellipse cx="69" cy="30" rx="21" ry="23"/><path d="M108 8 L124 52.5 L140 8"/><path d="M158 52 L174 7.5 L190 52 M163.9 37 H184.1"/></g><g style="stroke:var(--le)"><path d="M216 8 V52 M216 8 H240 M216 30 H236 M216 52 H240"/><path d="M293.55 15.84 A 21 23 0 1 0 293.55 44.16"/><path d="M314 8 V52 M314 8 H338 M314 30 H334 M314 52 H338"/></g></g></svg><b id="title">STEAM Lab</b></div>
    <div class="lang" role="group" aria-label="Dil / Language"><button id="l-tr" aria-pressed="true">TR</button><button id="l-en" aria-pressed="false">EN</button></div>
  </header>
  <div class="say" aria-live="polite"><img id="say-img" src="img/piti.webp" alt=""><p id="say"></p><button class="rep" id="rep" aria-label="Dinle">🔊</button></div>
  <main id="view"></main>
</div>
<div class="overlay" id="ov" hidden><div class="modal" id="modal"></div></div>
<script src="texts.js"></script>
<script src="app.js"></script>
<script src="acts.js"></script>

<script src="destek-mini.js"></script>
<footer style="text-align:center;padding:24px;font:14px system-ui"><a href="/steam-lab/privacy/">Gizlilik / Privacy</a></footer>
</body>
</html>
